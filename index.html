<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="themeColor" content="#2e2e2e">
  <meta name="robots" content="noindex">
  <title>Krishna Vamshi & Harika | A letter for family</title>
  <meta name="description" content="To Dearest Family. Tap the seal.">
  <meta property="og:title" content="A letter from Krishna Vamshi & Harika">
  <meta property="og:description" content="To Dearest Family. Tap the seal.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Ramaraja&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8C%3C/text%3E%3C/svg%3E">
  <link rel="preload" as="image" href="images/envelope.webp">
  <link rel="preload" as="image" href="images/seal.webp">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="sealed">
  <!-- The letter itself, filled in by invite.js -->
  <main class="sheet" id="sheet"></main>

  <!-- The opening: the painted envelope, cut into layers so it can really open -->
  <div class="stage" id="stage">
    <p class="whisper" id="whisper"></p>
    <div class="scene" id="scene">
      <div class="lay base"></div>
      <div class="env-inside" id="inside"></div>
      <div class="letter" id="letter"><p class="letter-hello" id="letterHello"></p></div>
      <div class="lay pocket" id="pocket"></div>
      <div class="flap" id="flap">
        <div class="lay flap-face front" id="flapFront"></div>
        <div class="flap-face liner" id="flapLiner"></div>
      </div>
      <p class="address"><span id="addressTo"></span><svg class="address-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21C5 15.500 2.500 11.500 4.500 7.500 6.500 4 10.500 4.800 12 8.200 13.500 4.800 17.500 4 19.500 7.500 21.500 11.500 19 15.500 12 21Z"/></svg></p>
      <button class="seal" id="seal" type="button" aria-label="Break the seal and open your invitation">
        <span class="seal-half left" aria-hidden="true"></span>
        <span class="seal-half right" aria-hidden="true"></span>
      </button>
    </div>
    <p class="hint" id="hint"></p>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <script src="details.js"></script>
  <script src="invite.js"></script>
</body>
</html>
